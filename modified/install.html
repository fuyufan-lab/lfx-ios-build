<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>老鳳祥 · 安装</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icons/icon-192.png"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="老鳳祥LFX"/>
<meta name="theme-color" content="#1a1714"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#1a1714;color:#e8e0d4;font-family:-apple-system,BlinkMacSystemFont,'Inter','Manrope','PingFang SC','Microsoft YaHei',sans-serif;font-weight:300;display:flex;align-items:center;justify-content:center;min-height:100dvh}
.wrap{text-align:center;padding:2rem;width:100%;max-width:380px}
.logo{font-family:Georgia,serif;font-size:1.5rem;letter-spacing:.2em;margin-bottom:4px;color:#c4a265}
.sub{font-size:.6875rem;color:#9a9080;letter-spacing:.1em;margin-bottom:24px;text-transform:uppercase}

.platform-icon{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:2rem}
.ai{background:rgba(61,220,132,0.12)}.ai{background:rgba(61,220,132,0.12)}
.ii{background:rgba(0,122,255,0.12)}.hi{background:rgba(255,103,0,0.12)}

.info{font-size:.8125rem;color:#9a9080;margin-bottom:6px;line-height:1.5}
.info strong{color:#e8e0d4;font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 24px;background:#c4a265;color:#1a1714;border-radius:9999px;font-size:.9375rem;font-weight:600;text-decoration:none;border:none;cursor:pointer;letter-spacing:.02em;box-shadow:0 4px 20px rgba(196,162,101,0.25);transition:all .15s;margin-top:16px}
.btn:active{transform:scale(.97)}
.btn svg{flex-shrink:0}

.btn-alt{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px 24px;background:transparent;color:#c4a265;border:1px solid rgba(196,162,101,0.25);border-radius:9999px;font-size:.8125rem;font-weight:500;text-decoration:none;cursor:pointer;margin-top:8px}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#c4a265;color:#1a1714;padding:12px 24px;border-radius:9999px;font-size:.8125rem;font-weight:500;z-index:200;animation:sd .35s;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
@keyframes sd{from{transform:translateX(-50%) translateY(-60px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

.badge{display:inline-block;padding:3px 10px;border-radius:9999px;font-size:.625rem;font-weight:600;letter-spacing:.06em;margin-bottom:12px}
.badge-android{background:rgba(61,220,132,0.15);color:#61dc84}
.badge-ios{background:rgba(0,122,255,0.15);color:#007aff}
.badge-harmonyos{background:rgba(255,103,0,0.15);color:#ff6700}

.hidden{display:none!important}
</style>
</head>
<body>

<!-- Android -->
<div class="wrap hidden" id="view-android">
  <div class="badge badge-android">ANDROID</div>
  <div class="platform-icon ai">📦</div>
  <div class="logo">老鳳祥</div>
  <div class="sub">一键安装应用</div>
  <div class="info">约 <strong>3.9 MB</strong> · Android 7.0+</div>
  <a href="app/LFX-Android.apk" class="btn" id="androidBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    下载并安装
  </a>
</div>

<!-- iOS → itms-services OTA 一键安装 -->
<div class="wrap hidden" id="view-ios">
  <div class="badge badge-ios">IOS</div>
  <div class="platform-icon ii">📱</div>
  <div class="logo">老鳳祥</div>
  <div class="sub">一键安装应用</div>
  <div class="info">iOS 14+ · 点按下方按钮 → 弹出系统安装对话框 → 确认安装</div>
  <!-- itms-services 链接：点击即弹出 iOS 原生安装对话框 -->
  <a href="itms-services://?action=download-manifest&url=https://yh.xiaofenhe.com/lfx-preview/manifest.plist" class="btn" id="iosBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    一键安装
  </a>
  <div class="info" style="font-size:.625rem;color:#6a6055;margin-top:10px">如未弹出请用 Safari 打开</div>
</div>

<!-- 鸿蒙 → 直接下载 HAP -->
<div class="wrap hidden" id="view-harmonyos">
  <div class="badge badge-harmonyos">HARMONYOS</div>
  <div class="platform-icon hi">🔷</div>
  <div class="logo">老鳳祥</div>
  <div class="sub">一键安装应用</div>
  <div class="info">HarmonyOS 5.0+ · 下载后点击 HAP 文件即可安装</div>
  <a href="app/LFX-HarmonyOS.hap" class="btn" id="hmBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    下载并安装
  </a>
</div>

<!-- 桌面端 -->
<div class="wrap hidden" id="view-desktop">
  <div class="logo">老鳳祥</div>
  <div class="sub">扫码安装应用</div>
  <div class="info">请用手机扫描二维码安装<br/><span style="font-size:.625rem;color:#6a6055">支持 Android · iOS · 鸿蒙</span></div>
  <a href="下载.html" class="btn-alt" style="margin-top:20px">查看下载页 →</a>
</div>

<script>
(function(){
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/.test(ua);
  var isIOS = /iPad|iPhone|iPod/.test(ua);
  var isHarmonyOS = /HarmonyOS|OpenHarmony/.test(ua);
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches;

  // 已在 PWA 中 → 跳转首页
  if (isStandalone) {
    location.replace('入口页.html');
    return;
  }

  if (isAndroid) {
    document.getElementById('view-android').classList.remove('hidden');
    // 自动触发下载
    setTimeout(function(){
      var a = document.createElement('a');
      a.href = 'app/LFX-Android.apk';
      a.download = 'LFX-Android.apk';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, 600);
    return;
  }

  if (isIOS) {
    document.getElementById('view-ios').classList.remove('hidden');
    // 非 Safari 提示
    var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|OPiOS|mercury/.test(ua);
    if (!isSafari) {
      document.getElementById('iosBtn').textContent = '在 Safari 中打开安装';
      document.getElementById('iosBtn').href = '#';
      document.getElementById('iosBtn').addEventListener('click', function(e){
        e.preventDefault();
        showToast('请复制链接到 Safari 中打开，即可一键安装');
      });
    }
    return;
  }

  if (isHarmonyOS) {
    document.getElementById('view-harmonyos').classList.remove('hidden');
    return;
  }

  // 桌面端
  document.getElementById('view-desktop').classList.remove('hidden');
})();

function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}
</script>
</body></html>
