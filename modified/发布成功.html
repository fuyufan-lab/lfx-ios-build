<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<link rel="preconnect" href="https://fonts.googleapis.cn"/>
<link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin/>
<link rel="preconnect" href="https://cdn.tailwindcss.com"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>老鳳祥 · 发布成功</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.cn/css2?family=Manrope:wght@200;300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.cn/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<script src="shared.js"></script>
<script>
tailwind.config={theme:{extend:{colors:{
'bg':'#1a1714','card':'#242019','card-hi':'#2e2920',
'gold':'#c4a265','gold-d':'#8a7d65','gold-b':'#d4b275',
'tx':'#e8e0d4','tx2':'#9a9080','tx3':'#6a6055',
'bdr':'rgba(196,162,101,0.08)','bdr2':'rgba(196,162,101,0.18)',
'red':'#c45a42'
},fontFamily:{"h":["Manrope"],"b":["Manrope"],"l":["Inter"]},borderRadius:{"c":"12px","pill":"9999px","full":"9999px"}}}}
</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24}
body{background:#1a1714;color:#e8e0d4;min-height:max(884px,100dvh);font-weight:300;overflow-x:hidden;overflow-y:auto;transition:background .5s,color .4s}
body.light{background:#faf8f4;color:#2a2418}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 50% 15%,rgba(196,162,101,0.12) 0%,transparent 60%),radial-gradient(ellipse 50% 30% at 80% 60%,rgba(196,162,101,0.06) 0%,transparent 50%);pointer-events:none;z-index:0}
body.light::before{background:radial-gradient(ellipse 80% 40% at 50% 15%,rgba(196,162,101,0.15) 0%,transparent 60%),radial-gradient(ellipse 50% 30% at 20% 70%,rgba(196,162,101,0.08) 0%,transparent 50%)}
.glass{background:rgba(26,23,20,0.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
body.light .glass{background:rgba(250,248,244,0.92)}
.cd{background:#242019;border:1px solid rgba(196,162,101,0.06);border-radius:12px;transition:background .4s,border-color .4s}
body.light .cd{background:#fff;border-color:rgba(196,162,101,0.15)}
.cd-h{background:#2e2920;border:1px solid rgba(196,162,101,0.12);border-radius:12px}
body.light .cd-h{background:#f5f0e6;border-color:rgba(196,162,101,0.2)}
.sec-label{font-family:'Inter',sans-serif;font-size:.6875rem;letter-spacing:.15em;text-transform:uppercase;color:#c4a265;font-weight:500}
body.light .sec-label{color:#a08040}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes si{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
main{animation:fu .5s cubic-bezier(.23,1,.32,1)}
.success-icon{animation:si .5s ease-out}
::-webkit-scrollbar{display:none}*{scrollbar-width:none;-ms-overflow-style:none}

/* 亮色主题下 inline 暗色渐变 → 浅金渐变 */
body.light [style*="linear-gradient(135deg,#2a2418 0%,#3a3020 50%,#4a3828 100%)"]{
  background:linear-gradient(135deg,#e8d8b0 0%,#f0e4c8 50%,#f5eed8 100%) !important;
  color:#3a2818 !important;
}
body.light [style*="linear-gradient(135deg,#2a2418 0%,#3a3020 50%,#4a3828 100%)"] *{
  color:#3a2818 !important;
}
</style>
</head>
<body class="font-b">

<main class="pt-24 pb-32 px-5 max-w-md mx-auto text-center relative z-10">

  <div class="success-icon mt-8 mb-6">
    <div class="w-20 h-20 mx-auto bg-gold/10 rounded-full flex items-center justify-center">
      <span class="material-symbols-outlined text-gold text-4xl" style="font-variation-settings:'FILL'1">check_circle</span>
    </div>
  </div>

  <h1 class="font-h text-2xl font-extralight tracking-tight mb-2" id="successTitle">发布成功</h1>
  <p class="text-xs text-tx2 mb-8" id="successSub">内容已成功发布至所选平台</p>

  <div id="xhsGuide" class="cd-h p-4 mb-4 text-left" style="display:none;border-color:rgba(255,36,66,0.25)">
    <div class="flex items-start gap-3 mb-3">
      <span class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background:#fff5f3"><span style="color:#ff2442;font-weight:700;font-family:'PingFang SC','Hiragino Sans GB',sans-serif;font-size:11px">小</span></span>
      <div><p class="text-sm font-medium" style="color:#e8e0d4">请在小红书中确认发布</p><p class="text-[.5625rem] text-tx3 mt-0.5">文案已自动填入，检查无误后点击"发布"即可</p></div>
    </div>
    <div class="flex gap-2 text-[.5625rem] text-tx3">
      <span class="px-2 py-0.5 rounded-pill" style="background:rgba(255,36,66,0.1)">📋 文案自动填入</span>
      <span class="px-2 py-0.5 rounded-pill" style="background:rgba(255,36,66,0.1)">👆 点击发布按钮</span>
    </div>
  </div>

  <!-- 发布详情卡片 -->
  <div class="cd p-4 mb-4 text-left" id="pubCard">
    <div class="flex justify-between items-center mb-3">
      <span class="font-l text-[.625rem] text-tx3 uppercase tracking-wider">发布内容</span>
      <span class="text-[.5625rem] text-gold font-l" id="pubStatus">已发布</span>
    </div>
    <div class="h-16 flex items-center justify-center mb-3 rounded-c" style="background:linear-gradient(135deg,#2a2418 0%,#3a3020 50%,#4a3828 100%)"><span class="material-symbols-outlined text-gold-b" style="font-size:32px;font-variation-settings:'FILL'0,'wght'200">diamond</span></div>
    <p class="text-sm font-medium" id="pubTitle">古法金镶玉吊坠</p>
    <p class="text-[.625rem] text-tx2 mt-1" id="pubBody">非遗花丝镶嵌工艺，传承古法匠心</p>
    <div class="flex gap-2 mt-2">
      <span class="px-2 py-0.5 text-[.5625rem] bg-card-hi text-gold rounded-pill">#古法金</span>
      <span class="px-2 py-0.5 text-[.5625rem] bg-card-hi text-gold rounded-pill">#非遗工艺</span>
    </div>
  </div>

  <!-- 发布平台 -->
  <div class="cd p-4 mb-6 text-left">
    <span class="font-l text-[.625rem] text-tx3 uppercase tracking-wider">发布平台</span>
    <div class="flex gap-3 mt-2">
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-pill" style="background:#fff5f3">
        <span class="w-5 h-5 rounded-full flex items-center justify-center" style="background:#ff2442"><span style="color:#fff;font-size:9px;font-weight:700">小</span></span>
        <span class="text-xs" style="color:#1a1714">小红书</span>
      </div>
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-pill" style="background:#0a0a0a">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43V8.97a8.16 8.16 0 0 0 4.77 1.52V7.1a4.85 4.85 0 0 1-1.84-.41Z" fill="#fe2c55"/></svg>
        <span class="text-xs" style="color:#fff">抖音</span>
      </div>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="space-y-3">
    <a href="店员首页.html" class="block w-full py-4 bg-gold text-bg text-sm font-l tracking-[0.15em] uppercase rounded-c">继续发布</a>
    <a href="发布历史.html?new=1" class="block w-full py-4 border border-gold/20 text-gold text-sm font-l tracking-[0.15em] uppercase rounded-c">查看我的发布</a>
  </div>

  <p class="text-[.625rem] text-tx3 mt-6">内容已自动加入你的发布历史，可在「我的」页面查看数据反馈</p>

</main>

<script>
// XHS flow detection
(function(){
var q=new URLSearchParams(location.search);
var via=q.get('via');
var title=q.get('title')||'';
if(via==='xhs'){
  document.getElementById('xhsGuide').style.display='block';
  document.getElementById('successTitle').textContent='已唤起小红书';
  document.getElementById('successSub').textContent='请在下方小红书应用中确认并点击发布';
  document.getElementById('pubStatus').textContent='待确认发布';
  document.getElementById('pubStatus').style.color='#ff6b8a';
  if(title){
    try{var d=decodeURIComponent(title);document.getElementById('pubTitle').textContent=d;}catch(e){}
  }
  // Restore full text from localStorage as fallback
  try{var ft=localStorage.getItem('lfx_xhs_text');
    if(ft){
      var lines=ft.split('\n\n');
      if(lines.length>=2){
        var t2=lines[0];
        if(!title)document.getElementById('pubTitle').textContent=t2;
        document.getElementById('pubBody').textContent=lines[1]||'';
      }
      localStorage.removeItem('lfx_xhs_text');
    }
  }catch(e){}
}

// Theme
var LC={'bg':'#faf8f4','card':'#ffffff','card-hi':'#f5f0e6','gold':'#a08040','gold-d':'#8a7040','gold-b':'#b09050','tx':'#2a2418','tx2':'#5a5040','tx3':'#8a7d65','bdr':'rgba(196,162,101,0.12)','bdr2':'rgba(196,162,101,0.25)','red':'#c45a42'};
var DC={'bg':'#1a1714','card':'#242019','card-hi':'#2e2920','gold':'#c4a265','gold-d':'#8a7d65','gold-b':'#d4b275','tx':'#e8e0d4','tx2':'#9a9080','tx3':'#6a6055','bdr':'rgba(196,162,101,0.08)','bdr2':'rgba(196,162,101,0.18)','red':'#c45a42'};
function setTheme(t){document.body.classList.toggle('light',t==='light');localStorage.setItem('lfx-theme',t);var c=t==='light'?LC:DC;Object.keys(c).forEach(function(k){document.documentElement.style.setProperty('--'+k,c[k])})}
var tp=new URLSearchParams(location.search).get('theme');
var _t=tp||localStorage.getItem('lfx-theme')||'dark';
if(_t==='light')setTheme('light');
window.addEventListener('message',function(e){if(e.data&&e.data.type==='theme')setTheme(e.data.theme)});
})();
</script>
</body></html>
