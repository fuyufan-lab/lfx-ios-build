<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<link rel="preconnect" href="https://fonts.googleapis.cn"/>
<link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin/>
<link rel="preconnect" href="https://cdn.tailwindcss.com"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>注册 · 老鳳祥</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.cn/css2?family=Manrope:wght@200;300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.cn/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<script src="shared.js"></script>
<script>
tailwind.config={theme:{extend:{colors:{
'bg':'#1a1714','card':'#242019','card-hi':'#2e2920',
'gold':'#c4a265','gold-d':'#8a7d65','gold-b':'#d4b275',
'tx':'#e8e0d4','tx2':'#9a9080','tx3':'#6a6055',
'bdr':'rgba(196,162,101,0.08)','bdr2':'rgba(196,162,101,0.18)',
'red':'#c45a42'
},fontFamily:{"h":["Manrope"],"b":["Manrope"],"l":["Inter"]},borderRadius:{"c":"12px","pill":"9999px","full":"9999px"}}}}
</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24}
body{background:#1a1714;color:#e8e0d4;min-height:max(884px,100dvh);font-weight:300;overflow-x:hidden;overflow-y:auto;transition:background .5s,color .4s}
body.light{background:#faf8f4;color:#2a2418}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 50% 15%,rgba(196,162,101,0.12) 0%,transparent 60%),radial-gradient(ellipse 50% 30% at 80% 60%,rgba(196,162,101,0.06) 0%,transparent 50%);pointer-events:none;z-index:0}
body.light::before{background:radial-gradient(ellipse 80% 40% at 50% 15%,rgba(196,162,101,0.15) 0%,transparent 60%),radial-gradient(ellipse 50% 30% at 20% 70%,rgba(196,162,101,0.08) 0%,transparent 50%)}
.glass{background:rgba(26,23,20,0.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
body.light .glass{background:rgba(250,248,244,0.92)}
.cd{background:#242019;border:1px solid rgba(196,162,101,0.06);border-radius:12px;transition:background .4s,border-color .4s}
body.light .cd{background:#fff;border-color:rgba(196,162,101,0.15)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
main{animation:fu .5s cubic-bezier(.23,1,.32,1)}
.step{display:none;animation:slideIn .3s ease-out}
.step.active{display:block}
.phone-input{width:100%;padding:14px 0;border:none;border-bottom:2px solid rgba(196,162,101,0.15);font-size:24px;font-weight:300;letter-spacing:2px;color:#e8e0d4;outline:none;background:transparent;font-family:"Manrope","Inter",sans-serif;transition:border-color .3s}
body.light .phone-input{color:#2a2418;border-bottom-color:#e0d8c8}
.phone-input:focus{border-bottom-color:#c4a265}
body.light .phone-input:focus{border-bottom-color:#a08040}
.input-line{width:100%;padding:14px 0;border:none;border-bottom:2px solid rgba(196,162,101,0.15);font-size:16px;color:#e8e0d4;outline:none;background:transparent;font-family:"Manrope","Inter",sans-serif;transition:border-color .3s}
body.light .input-line{color:#2a2418;border-bottom-color:#e0d8c8}
.input-line:focus{border-bottom-color:#c4a265}
body.light .input-line:focus{border-bottom-color:#a08040}
.code-box{width:44px;height:52px;border:1.5px solid rgba(196,162,101,0.12);border-radius:8px;text-align:center;font-size:22px;font-weight:400;color:#e8e0d4;outline:none;background:#242019;font-family:"Manrope","Inter",sans-serif;transition:all .3s}
body.light .code-box{color:#2a2418;background:#fff;border-color:rgba(196,162,101,0.2)}
.code-box:focus{border-color:#c4a265;background:#2e2920}
body.light .code-box:focus{border-color:#a08040;background:#f5f0e6}
.btn-primary{width:100%;padding:14px;background:#c4a265;color:#1a1714;border:none;font-size:15px;font-weight:600;letter-spacing:0.05em;cursor:pointer;transition:all .3s;border-radius:12px}
.btn-primary:disabled{opacity:0.45;cursor:not-allowed}
.btn-primary:hover:not(:disabled){background:#d4b275}
body.light .btn-primary{background:#a08040;color:#fff}
body.light .btn-primary:hover:not(:disabled){background:#b09050}
.btn-secondary{width:100%;padding:14px;background:transparent;color:#c4a265;border:1px solid rgba(196,162,101,0.2);font-size:15px;font-weight:500;letter-spacing:0.05em;cursor:pointer;transition:all .3s;border-radius:12px}
.btn-secondary:hover{background:rgba(196,162,101,0.06)}
body.light .btn-secondary{color:#a08040;border-color:rgba(196,162,101,0.3)}
.back-link{display:inline-flex;align-items:center;gap:4px;color:#9a9080;font-size:14px;text-decoration:none;cursor:pointer;transition:color .2s}
.back-link:hover{color:#e8e0d4}
body.light .back-link{color:#8a7d65}
body.light .back-link:hover{color:#2a2418}
.step-indicator{display:flex;gap:6px;justify-content:center}
.step-dot{width:6px;height:6px;border-radius:50%;background:#2e2920;transition:all .3s}
body.light .step-dot{background:#e0d8c8}
.step-dot.done{background:#c4a265;width:20px;border-radius:3px}
.step-dot.current{background:#c4a265}
body.light .step-dot.done,body.light .step-dot.current{background:#a08040}
.select-card{display:block;width:100%;padding:14px 16px;border:1px solid rgba(196,162,101,0.12);background:#242019;text-align:left;font-size:14px;color:#e8e0d4;cursor:pointer;transition:all .2s;border-radius:12px}
body.light .select-card{background:#fff;border-color:rgba(196,162,101,0.2);color:#2a2418}
.select-card:hover,.select-card.selected{border-color:#c4a265;background:#2e2920}
body.light .select-card:hover,body.light .select-card.selected{border-color:#a08040;background:#f5f0e6}
.select-card.selected{border-width:2px}
.select-card .check{display:none}
.select-card.selected .check{display:inline}
::-webkit-scrollbar{display:none}*{scrollbar-width:none;-ms-overflow-style:none}
</style>
<script defer src="mobile-preview-frame.js"></script>
</head>
<body class="font-b">

<main class="min-h-screen flex flex-col relative z-10">
  <!-- Header -->
  <header class="flex items-center justify-between px-5 pt-5 pb-3">
    <a href="入口页.html" class="back-link" id="backBtn">
      <span class="material-symbols-outlined text-xl">arrow_back</span>
    </a>
    <span class="text-base font-light tracking-[0.15em]" style="font-family:Georgia,serif">老鳳祥</span>
    <span class="w-8"></span>
  </header>

  <!-- Step Indicator -->
  <div class="step-indicator mt-2 mb-8">
    <div class="step-dot current" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
    <div class="step-dot" id="dot3"></div>
  </div>

  <div class="flex-1 px-6 max-w-md mx-auto w-full">
    
    <!-- ====== STEP 1: 手机号 ====== -->
    <section class="step active" id="step1">
      <h1 class="font-h text-2xl font-extralight tracking-tight mb-2">注册账号</h1>
      <p class="text-sm text-tx2 mb-10">输入手机号，创建老凤祥平台账号</p>
      
      <div class="mb-8">
        <label class="text-xs text-tx2 mb-2 block font-l">手机号码</label>
        <div class="flex items-center border-b-2 border-bdr focus-within:border-gold transition-colors pb-2">
          <span class="text-base text-tx mr-2 font-medium">+86</span>
          <span class="text-tx3 mr-2">|</span>
          <input class="phone-input flex-1" id="phoneInput" type="tel" placeholder="请输入手机号" maxlength="11" inputmode="numeric" autofocus/>
        </div>
        <p class="text-[0.625rem] text-red mt-2 hidden" id="phoneError">请输入正确的11位手机号</p>
      </div>

      <p class="text-xs text-tx3 mb-6">点击"下一步"即表示同意<span class="text-gold">《用户服务协议》</span>和<span class="text-gold">《隐私政策》</span></p>
      <button class="btn-primary rounded-c" id="phoneNextBtn">下一步</button>
    </section>

    <!-- ====== STEP 2: 验证码 ====== -->
    <section class="step" id="step2">
      <h1 class="font-h text-2xl font-extralight tracking-tight mb-2">输入验证码</h1>
      <p class="text-sm text-tx2 mb-2">验证码已发送至</p>
      <p class="text-sm font-medium text-tx mb-10" id="displayPhone">+86 138****5678</p>

      <div class="mb-8">
        <div class="flex gap-2 justify-center" id="codeInputs">
          <input class="code-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="0"/>
          <input class="code-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="1"/>
          <input class="code-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="2"/>
          <input class="code-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="3"/>
          <input class="code-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="4"/>
          <input class="code-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="5"/>
        </div>
      </div>

      <div class="text-center mb-6">
        <button class="text-xs text-gold font-l" id="resendBtn" disabled>重新发送 (<span id="countdown">60</span>s)</button>
      </div>

      <button class="btn-primary rounded-c hidden" id="codeSubmitBtn">下一步</button>
    </section>

    <!-- ====== STEP 3: 填写信息 ====== -->
    <section class="step" id="step3">
      <h1 class="font-h text-2xl font-extralight tracking-tight mb-2">完善信息</h1>
      <p class="text-sm text-tx2 mb-8">请填写您的基本信息</p>

      <!-- 姓名 -->
      <div class="mb-5">
        <label class="text-xs text-tx2 mb-2 block font-l">姓名</label>
        <input class="input-line" id="nameInput" type="text" placeholder="请输入真实姓名"/>
      </div>

      <!-- 工号 -->
      <div class="mb-5">
        <label class="text-xs text-tx2 mb-2 block font-l">员工编号</label>
        <input class="input-line" id="staffIdInput" type="text" placeholder="请输入员工编号"/>
      </div>

      <!-- 所属门店 -->
      <div class="mb-5">
        <label class="text-xs text-tx2 mb-2 block font-l">所属门店</label>
        <button class="select-card flex items-center justify-between" id="storeBtn" onclick="toggleStoreList()">
          <span id="storeLabel">请选择门店</span>
          <span class="material-symbols-outlined text-tx3 text-xl">expand_more</span>
        </button>
        <div class="mt-1 space-y-1 hidden" id="storeList">
          <button class="select-card" onclick="selectStore('上海南京路旗舰店')">上海南京路旗舰店</button>
          <button class="select-card" onclick="selectStore('上海淮海路店')">上海淮海路店</button>
          <button class="select-card" onclick="selectStore('上海徐家汇店')">上海徐家汇店</button>
          <button class="select-card" onclick="selectStore('杭州武林店')">杭州武林店</button>
          <button class="select-card" onclick="selectStore('南京新街口店')">南京新街口店</button>
        </div>
      </div>

      <!-- 身份角色 -->
      <div class="mb-8">
        <label class="text-xs text-tx2 mb-2 block font-l">身份角色</label>
        <div class="grid grid-cols-2 gap-2">
          <button class="select-card text-center selected" data-role="staff" onclick="selectRole(this,'普通店员')">普通店员</button>
          <button class="select-card text-center" data-role="manager" onclick="selectRole(this,'店长')">店长</button>
          <button class="select-card text-center" data-role="dealer" onclick="selectRole(this,'经销商老板')">经销商老板</button>
          <button class="select-card text-center" data-role="agent" onclick="selectRole(this,'省代/分公司')">省代/分公司</button>
        </div>
      </div>

      <button class="btn-primary rounded-c" id="completeBtn">完成注册</button>
      <p class="text-center text-xs text-tx3 mt-4">已有账号？<a href="登录页.html" class="lfx-link-sub">立即登录</a></p>
    </section>

    <!-- ====== STEP 4: 完成 ====== -->
    <section class="step" id="step4">
      <div class="text-center pt-12">
        <div class="w-20 h-20 mx-auto mb-6 bg-card-hi rounded-full flex items-center justify-center border border-bdr2">
          <span class="material-symbols-outlined text-gold text-4xl" style="font-variation-settings:'FILL'1">check</span>
        </div>
        <h1 class="font-h text-2xl font-extralight tracking-tight mb-2">注册成功</h1>
        <p class="text-sm text-tx2 mb-8">欢迎加入老凤祥内容生态平台</p>
        <button class="btn-primary rounded-c" onclick="window.location.href='入口页.html'">进入平台</button>
      </div>
    </section>

  </div>

</main>

<script>
// ============ STEP FLOW ============
let currentStep = 1;
let phoneNumber = '';
const VALID_INVITE_CODE = '888888';  // 与登录页一致的邀请码
let codeTimer = null;
let selectedStore = '';
let selectedRole = '普通店员';

function showStep(stepId, dotDone) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(stepId).classList.add('active');
  
  ['dot1','dot2','dot3'].forEach((id, i) => {
    const dot = document.getElementById(id);
    if (i < dotDone - 1) dot.className = 'step-dot done';
    else if (i === dotDone - 1) dot.className = 'step-dot current';
    else dot.className = 'step-dot';
  });

  const backBtn = document.getElementById('backBtn');
  if (dotDone <= 1) {
    backBtn.href = '入口页.html';
    backBtn.onclick = null;
  } else {
    backBtn.href = '#';
    backBtn.onclick = function(e) { e.preventDefault(); goBack(); };
  }
  currentStep = dotDone;
}

function goBack() {
  if (currentStep > 1) {
    showStep('step' + (currentStep - 1), currentStep - 1);
    if (currentStep === 2) clearCodeTimer();
  }
}

// ============ STEP 1: PHONE ============
document.getElementById('phoneNextBtn').addEventListener('click', function() {
  const phone = document.getElementById('phoneInput').value.replace(/\s/g, '');
  if (phone.length !== 11 || !/^1\d{10}$/.test(phone)) {
    document.getElementById('phoneError').classList.remove('hidden');
    return;
  }
  document.getElementById('phoneError').classList.add('hidden');
  phoneNumber = phone;
  document.getElementById('displayPhone').textContent = '+86 ' + phone.slice(0,3) + '****' + phone.slice(7);
  
  showStep('step2', 2);
  setTimeout(() => document.querySelector('#codeInputs input').focus(), 300);
  startCodeCountdown();
});

// ============ STEP 2: VERIFICATION CODE ============
const codeInputs = document.querySelectorAll('#codeInputs input');
codeInputs.forEach((input, index) => {
  input.addEventListener('input', function(e) {
    if (!/^\d$/.test(e.target.value)) { e.target.value = ''; return; }
    if (e.target.value && index < 5) codeInputs[index + 1].focus();
    checkCodeComplete();
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && !e.target.value && index > 0) codeInputs[index - 1].focus();
  });
  input.addEventListener('paste', function(e) {
    e.preventDefault();
    const paste = (e.clipboardData || window.clipboardData).getData('text');
    const digits = paste.replace(/\D/g, '').slice(0, 6);
    digits.split('').forEach((d, i) => { if (codeInputs[i]) codeInputs[i].value = d; });
    codeInputs[Math.min(digits.length, 5)].focus();
    checkCodeComplete();
  });
});

function checkCodeComplete() {
  const code = Array.from(codeInputs).map(i => i.value).join('');
  const submitBtn = document.getElementById('codeSubmitBtn');
  if (code.length === 6) {
    submitBtn.classList.remove('hidden');
    setTimeout(() => {
      if (Array.from(codeInputs).map(i => i.value).join('').length === 6) {
        goToInfoStep();
      }
    }, 500);
  } else {
    submitBtn.classList.add('hidden');
  }
}

document.getElementById('codeSubmitBtn').addEventListener('click', goToInfoStep);

function goToInfoStep() {
  const code = Array.from(codeInputs).map(i => i.value).join('');
  if (code !== VALID_INVITE_CODE) {
    LFX.toast('邀请码错误，请重试', {kind:'error'});
    codeInputs.forEach(i => { i.value = ''; i.style.borderColor = '#c45a42'; });
    codeInputs[0].focus();
    document.getElementById('codeSubmitBtn').classList.add('hidden');
    setTimeout(() => { codeInputs.forEach(i => i.style.borderColor = ''); }, 1500);
    return;
  }
  document.getElementById('codeError') && document.getElementById('codeError').classList.add('hidden');
  clearCodeTimer();
  showStep('step3', 3);
}

function startCodeCountdown() {
  clearCodeTimer();
  let countdown = 60;
  const resendBtn = document.getElementById('resendBtn');
  const countdownEl = document.getElementById('countdown');
  resendBtn.disabled = true;
  
  codeTimer = setInterval(function() {
    countdown--;
    countdownEl.textContent = countdown;
    if (countdown <= 0) {
      clearCodeTimer();
      resendBtn.disabled = false;
      resendBtn.innerHTML = '重新发送';
    }
  }, 1000);
}

function clearCodeTimer() {
  if (codeTimer) { clearInterval(codeTimer); codeTimer = null; }
}

document.getElementById('resendBtn').addEventListener('click', function() {
  if (this.disabled) return;
  codeInputs.forEach(i => i.value = '');
  document.getElementById('codeSubmitBtn').classList.add('hidden');
  codeInputs[0].focus();
  startCodeCountdown();
});

// ============ STEP 3: PROFILE ============
function toggleStoreList() {
  document.getElementById('storeList').classList.toggle('hidden');
}

function selectStore(name) {
  selectedStore = name;
  document.getElementById('storeLabel').textContent = name;
  document.getElementById('storeBtn').classList.add('selected');
  document.getElementById('storeList').classList.add('hidden');
  document.querySelectorAll('#storeList .select-card').forEach(btn => {
    btn.classList.toggle('selected', btn.textContent.trim() === name);
  });
}

function selectRole(btn, role) {
  selectedRole = role;
  document.querySelectorAll('[data-role]').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

document.getElementById('completeBtn').addEventListener('click', function() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { LFX.toast('请输入姓名',{kind:'error'}); return; }
  if (!selectedStore) { LFX.toast('请选择所属门店',{kind:'error'}); return; }
  
  this.textContent = '注册中...';
  this.disabled = true;
  
  setTimeout(() => {
    showStep('step4', 4);
    if (window.LFX && LFX.Store){
      LFX.Store.login({ phone: phoneNumber || '', role: 'staff', name: name, store: selectedStore });
    }
    setTimeout(() => { window.location.href = '入口页.html'; }, 2000);
  }, 1500);
});

// Theme
var LC={'bg':'#faf8f4','card':'#ffffff','card-hi':'#f5f0e6','gold':'#a08040','gold-d':'#8a7040','gold-b':'#b09050','tx':'#2a2418','tx2':'#5a5040','tx3':'#8a7d65','bdr':'rgba(196,162,101,0.12)','bdr2':'rgba(196,162,101,0.25)','red':'#c45a42'};
var DC={'bg':'#1a1714','card':'#242019','card-hi':'#2e2920','gold':'#c4a265','gold-d':'#8a7d65','gold-b':'#d4b275','tx':'#e8e0d4','tx2':'#9a9080','tx3':'#6a6055','bdr':'rgba(196,162,101,0.08)','bdr2':'rgba(196,162,101,0.18)','red':'#c45a42'};
function setTheme(t){document.body.classList.toggle('light',t==='light');localStorage.setItem('lfx-theme',t);var c=t==='light'?LC:DC;Object.keys(c).forEach(k=>{document.documentElement.style.setProperty('--'+k,c[k])})}
var tp=new URLSearchParams(location.search).get('theme');
var _t=tp||localStorage.getItem('lfx-theme')||'dark';
if(_t==='light')setTheme('light');
window.addEventListener('message',function(e){if(e.data&&e.data.type==='theme')setTheme(e.data.theme)});
</script>
</body></html>
