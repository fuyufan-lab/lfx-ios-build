name: iOS IPA Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_mode:
        description: '构建模式'
        required: true
        type: choice
        options:
          - development
          - ad-hoc
          - enterprise
        default: 'development'

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Create www directory
        run: |
          mkdir -p www
          # 创建最小化的 index.html，加载远程内容
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>LFX 珠宝内容</title>
            <script>
              window.location.href = 'https://yh.xiaofenhe.com/lfx-preview/入口页.html';
            </script>
          </head>
          <body>
            <p>加载中...</p>
          </body>
          </html>
          EOF

      - name: Capacitor Sync
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Import Signing Certificate
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 -d > /tmp/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Set Team ID
        run: |
          sed -i '' "s/YOUR_TEAM_ID/${{ secrets.IOS_TEAM_ID }}/g" ExportOptions.plist
          cat ExportOptions.plist

      - name: Build Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /tmp/LFX.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} \
            archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath /tmp/LFX.xcarchive \
            -exportPath /tmp/LFX-export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LFX-iOS.ipa
          path: /tmp/LFX-export/*.ipa
          retention-days: 30

      - name: Deploy to server
        if: success()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 43.112.78.27 >> ~/.ssh/known_hosts
          scp /tmp/LFX-export/*.ipa root@43.112.78.27:/root/lfx-preview/app/LFX-iOS.ipa
          echo "✅ IPA 已上传到服务器"
