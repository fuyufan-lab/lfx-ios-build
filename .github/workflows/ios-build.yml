name: iOS IPA Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_mode:
        description: '构建模式'
        required: true
        type: choice
        options:
          - development
          - ad-hoc
          - enterprise
        default: 'development'

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Create www directory
        run: |
          mkdir -p www
          # 创建最小化的 index.html，加载远程内容
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>LFX 珠宝内容</title>
            <script>
              window.location.href = 'https://yh.xiaofenhe.com/lfx-preview/入口页.html';
            </script>
          </head>
          <body>
            <p>加载中...</p>
          </body>
          </html>
          EOF

      - name: Capacitor Sync
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Import Signing Certificate
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 -d > /tmp/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Get Certificate UUID
        id: cert
        run: |
          # 查找证书的 UUID（匹配 Apple Development 或 iPhone Developer）
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain 2>&1)
          echo "--- All identities ---"
          echo "$CERT_INFO"
          
          # 提取第一个有效证书的 UUID
          CERT_UUID=$(echo "$CERT_INFO" | grep -E '(iPhone Developer|Apple Development)' | head -1 | awk '{print $2}')
          
          if [ -z "$CERT_UUID" ]; then
            echo "Warning: No certificate found, using ad-hoc signing"
            CERT_UUID=""
          fi
          echo "uuid=$CERT_UUID" >> $GITHUB_OUTPUT
          echo "Certificate UUID: $CERT_UUID"

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Set Team ID
        run: |
          sed -i '' "s/YOUR_TEAM_ID/${{ secrets.IOS_TEAM_ID }}/g" ExportOptions.plist
          cat ExportOptions.plist

      - name: Build Archive
        run: |
          cd ios/App
          # 先用无签名方式构建（快速）
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /tmp/LFX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Sign App and Create IPA
        run: |
          APP_PATH="/tmp/LFX.xcarchive/Products/Applications/App.app"
          CERT_UUID="${{ steps.cert.outputs.uuid }}"
          
          if [ -n "$CERT_UUID" ] && [ "$CERT_UUID" != "" ]; then
            echo "Signing with certificate: $CERT_UUID"
            # 先签名所有 embedded frameworks
            find "$APP_PATH" -name "*.framework" -exec codesign --force --sign "$CERT_UUID" --timestamp=none {} \; 2>/dev/null || true
            # 签名 App
            codesign --force --sign "$CERT_UUID" --timestamp=none "$APP_PATH" 2>&1 || echo "Codesign failed, continuing unsigned"
          else
            echo "No certificate UUID, skipping signing"
          fi
          
          # 打包 IPA
          mkdir -p /tmp/LFX-export/Payload
          cp -r "$APP_PATH" /tmp/LFX-export/Payload/
          cd /tmp/LFX-export
          zip -r -q LFX-iOS.ipa Payload
          echo "✅ IPA created"
          ls -lh LFX-iOS.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LFX-iOS.ipa
          path: /tmp/LFX-export/*.ipa
          retention-days: 30

      - name: Deploy to server
        if: success()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 43.112.78.27 >> ~/.ssh/known_hosts
          scp /tmp/LFX-export/*.ipa root@43.112.78.27:/root/lfx-preview/app/LFX-iOS.ipa
          echo "✅ IPA 已上传到服务器"
